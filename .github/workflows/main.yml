name: Build AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AppImage tooling
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            wget \
            file \
            desktop-file-utils \
            fuse

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Prepare AppDir
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr

          if [ ! -d "dist" ]; then
            echo "❌ dist directory not found"
            exit 1
          fi

          cp -r dist/. AppDir/usr/

      - name: Create desktop file
        run: |
          set -euo pipefail

          cat > AppDir/sanne-daw.desktop <<'EOF'
[Desktop Entry]
Name=Sanne DAW
Exec=usr/bin/ardour6
Icon=image
Type=Application
Categories=AudioVideo;Audio;
EOF

          desktop-file-validate AppDir/sanne-daw.desktop

      - name: Add application icon
        run: |
          set -euo pipefail

          if [ -f "image.png" ]; then
            cp image.png AppDir/image.png
          else
            echo "❌ image.png not found in repository root"
            exit 1
          fi

      - name: Create AppRun launcher
        run: |
          set -euo pipefail

          cat > AppDir/AppRun <<'EOF'
#!/usr/bin/env bash
set -e

HERE="$(dirname "$(readlink -f "$0")")"

export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
exec "$HERE/usr/bin/ardour6" "$@"
EOF

          chmod +x AppDir/AppRun

      - name: Validate AppDir
        run: |
          set -euo pipefail

          test -f AppDir/AppRun
          test -f AppDir/sanne-daw.desktop
          test -f AppDir/image.png

      - name: Build AppImage
        run: |
          set -euo pipefail

          ARCH=x86_64 appimagetool AppDir Sanne-DAW-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanne-DAW-AppImage
          path: Sanne-DAW-x86_64.AppImage
