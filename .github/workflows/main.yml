name: Build AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    env:
      APP_NAME: Sanne-DAW
      BINARY_NAME: ardour6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            file \
            desktop-file-utils \
            libfuse2 \
            patchelf \
            zsync

      - name: Download linuxdeploy
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy

          chmod +x linuxdeploy

      - name: Debug repository contents
        shell: bash
        run: |
          set -euo pipefail

          echo "📂 Repository root:"
          ls -lah

          echo ""
          echo "📂 Recursive listing:"
          find . | sort

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr

          # Try common build output directories
          if [ -d "dist" ]; then
            echo "✅ Using dist/"
            cp -r dist/. AppDir/usr/

          elif [ -d "build" ]; then
            echo "✅ Using build/"
            cp -r build/. AppDir/usr/

          elif [ -d "release" ]; then
            echo "✅ Using release/"
            cp -r release/. AppDir/usr/

          else
            echo "❌ No dist/, build/, or release/ directory found"
            exit 1
          fi

      - name: Validate Ardour binary
        shell: bash
        run: |
          set -euo pipefail

          echo "📂 Listing binaries:"
          find AppDir/usr/bin -type f || true

          if [ ! -f "AppDir/usr/bin/${BINARY_NAME}" ]; then
            echo "❌ Binary AppDir/usr/bin/${BINARY_NAME} not found"

            echo ""
            echo "📂 Available files:"
            find AppDir/usr | sort

            exit 1
          fi

          chmod +x "AppDir/usr/bin/${BINARY_NAME}"

      - name: Create desktop entry
        shell: bash
        run: |
          set -euo pipefail

          cat > "AppDir/${APP_NAME}.desktop" <<'EOF'
          [Desktop Entry]
          Name=Sanne DAW
          Exec=ardour6
          Icon=sanne-daw
          Type=Application
          Categories=AudioVideo;Audio;
          Terminal=false
          StartupWMClass=Ardour
          EOF

          sed -i 's/^          //' "AppDir/${APP_NAME}.desktop"

          desktop-file-validate "AppDir/${APP_NAME}.desktop"

      - name: Add application icon
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "image.png" ]; then
            cp image.png AppDir/sanne-daw.png
          else
            echo "❌ image.png not found in repository root"
            exit 1
          fi

      - name: Create AppRun
        shell: bash
        run: |
          set -euo pipefail

          cat > AppDir/AppRun <<EOF
          #!/usr/bin/env bash
          set -e

          HERE="\$(dirname "\$(readlink -f "\$0")")"

          export LD_LIBRARY_PATH="\$HERE/usr/lib:\$HERE/usr/lib64:\$HERE/usr/lib/x86_64-linux-gnu:\$LD_LIBRARY_PATH"

          exec "\$HERE/usr/bin/${BINARY_NAME}" "\$@"
          EOF

          sed -i 's/^          //' AppDir/AppRun

          chmod +x AppDir/AppRun

      - name: Debug AppDir structure
        shell: bash
        run: |
          set -euo pipefail

          echo "📂 AppDir structure:"
          find AppDir | sort

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=x86_64

          ./linuxdeploy \
            --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file "AppDir/${APP_NAME}.desktop" \
            --icon-file AppDir/sanne-daw.png \
            --output appimage

      - name: Validate generated AppImage
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 Generated files:"
          ls -lah

          APPIMAGE_FILE=$(find . -maxdepth 1 -name "*.AppImage" | head -n 1)

          if [ -z "$APPIMAGE_FILE" ]; then
            echo "❌ AppImage was not generated"
            exit 1
          fi

          chmod +x "$APPIMAGE_FILE"

          echo "✅ AppImage generated:"
          echo "$APPIMAGE_FILE"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanne-DAW-AppImage
          path: "*.AppImage"
