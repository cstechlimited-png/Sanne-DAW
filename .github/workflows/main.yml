name: Build AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    env:
      APP_NAME: Sanne-DAW
      BINARY_NAME: ardour6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            file \
            desktop-file-utils \
            libfuse2 \
            patchelf \
            zsync

      - name: Download linuxdeploy tools
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh \
            -O linuxdeploy-plugin-gtk.sh

          chmod +x linuxdeploy
          chmod +x linuxdeploy-plugin-gtk.sh

      - name: Prepare AppDir
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr

          if [ ! -d "dist" ]; then
            echo "❌ dist directory not found"
            exit 1
          fi

          cp -r dist/. AppDir/usr/

      - name: Validate Ardour binary
        run: |
          set -euo pipefail

          echo "📂 Listing binaries:"
          find AppDir/usr/bin -type f || true

          if [ ! -f "AppDir/usr/bin/${BINARY_NAME}" ]; then
            echo "❌ Binary AppDir/usr/bin/${BINARY_NAME} not found"
            exit 1
          fi

          chmod +x "AppDir/usr/bin/${BINARY_NAME}"

      - name: Create desktop entry
        run: |
          set -euo pipefail

          cat > "AppDir/${APP_NAME}.desktop" <<EOF
[Desktop Entry]
Name=Sanne DAW
Exec=${BINARY_NAME}
Icon=sanne-daw
Type=Application
Categories=AudioVideo;Audio;
Terminal=false
StartupWMClass=Ardour
EOF

          desktop-file-validate "AppDir/${APP_NAME}.desktop"

      - name: Add application icon
        run: |
          set -euo pipefail

          if [ -f "image.png" ]; then
            cp image.png AppDir/sanne-daw.png
          else
            echo "❌ image.png not found in repository root"
            exit 1
          fi

      - name: Create AppRun
        run: |
          set -euo pipefail

          cat > AppDir/AppRun <<EOF
#!/usr/bin/env bash
set -e

HERE="\$(dirname "\$(readlink -f "\$0")")"

export LD_LIBRARY_PATH="\$HERE/usr/lib:\$HERE/usr/lib64:\$HERE/usr/lib/x86_64-linux-gnu:\$LD_LIBRARY_PATH"

exec "\$HERE/usr/bin/${BINARY_NAME}" "\$@"
EOF

          chmod +x AppDir/AppRun

      - name: Debug AppDir structure
        run: |
          set -euo pipefail

          echo "📂 AppDir structure:"
          find AppDir | sort

      - name: Bundle shared libraries
        env:
          DEPLOY_GTK_VERSION: 3
        run: |
          set -euo pipefail

          export OUTPUT=appimage

          ./linuxdeploy \
            --appdir AppDir \
            --desktop-file "AppDir/${APP_NAME}.desktop" \
            --icon-file AppDir/sanne-daw.png \
            --plugin gtk \
            --output appimage

      - name: Validate generated AppImage
        run: |
          set -euo pipefail

          ls -lah *.AppImage || true

          APPIMAGE_FILE=$(find . -maxdepth 1 -name "*.AppImage" | head -n 1)

          if [ -z "$APPIMAGE_FILE" ]; then
            echo "❌ AppImage was not generated"
            exit 1
          fi

          chmod +x "$APPIMAGE_FILE"

          echo "✅ AppImage generated:"
          echo "$APPIMAGE_FILE"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanne-DAW-AppImage
          path: "*.AppImage"
