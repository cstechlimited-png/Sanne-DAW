name: Build AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    env:
      APP_NAME: Sanne-DAW
      BINARY_NAME: ardour6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            file \
            desktop-file-utils \
            libfuse2 \
            patchelf \
            zsync

      - name: Download linuxdeploy
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy

          chmod +x linuxdeploy

      - name: Debug repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "📂 Root files:"
          ls -lah

          echo ""
          echo "📂 Full repository tree:"
          find . | sort

      #
      # IMPORTANT:
      # You currently DO NOT have a compiled Ardour build output.
      # So this workflow now creates AppDir directly from your repository.
      #

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share

          #
          # Copy repository contents
          #
          cp -r ./* AppDir/usr/ || true

          #
          # If ardour6 exists somewhere, move it properly
          #
          ARDOUR_BIN=$(find AppDir/usr -type f -name "${BINARY_NAME}" | head -n 1 || true)

          if [ -z "$ARDOUR_BIN" ]; then
            echo "❌ Could not locate ${BINARY_NAME}"
            echo ""
            echo "📂 Available files:"
            find AppDir/usr | sort
            exit 1
          fi

          echo "✅ Found binary:"
          echo "$ARDOUR_BIN"

          cp "$ARDOUR_BIN" "AppDir/usr/bin/${BINARY_NAME}"

          chmod +x "AppDir/usr/bin/${BINARY_NAME}"

      - name: Create desktop entry
        shell: bash
        run: |
          set -euo pipefail

          cat > "AppDir/${APP_NAME}.desktop" <<'EOF'
          [Desktop Entry]
          Name=Sanne DAW
          Exec=ardour6
          Icon=sanne-daw
          Type=Application
          Categories=AudioVideo;Audio;
          Terminal=false
          StartupWMClass=Ardour
          EOF

          sed -i 's/^          //' "AppDir/${APP_NAME}.desktop"

          desktop-file-validate "AppDir/${APP_NAME}.desktop"

      - name: Add application icon
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "image.png" ]; then
            cp image.png AppDir/sanne-daw.png
          else
            echo "❌ image.png not found"
            exit 1
          fi

      - name: Create AppRun
        shell: bash
        run: |
          set -euo pipefail

          cat > AppDir/AppRun <<EOF
          #!/usr/bin/env bash
          set -e

          HERE="\$(dirname "\$(readlink -f "\$0")")"

          export LD_LIBRARY_PATH="\$HERE/usr/lib:\$HERE/usr/lib64:\$HERE/usr/lib/x86_64-linux-gnu:\$LD_LIBRARY_PATH"

          exec "\$HERE/usr/bin/${BINARY_NAME}" "\$@"
          EOF

          sed -i 's/^          //' AppDir/AppRun

          chmod +x AppDir/AppRun

      - name: Debug AppDir structure
        shell: bash
        run: |
          set -euo pipefail

          echo "📂 Final AppDir:"
          find AppDir | sort

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=x86_64

          ./linuxdeploy \
            --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file "AppDir/${APP_NAME}.desktop" \
            --icon-file AppDir/sanne-daw.png \
            --output appimage

      - name: Validate AppImage
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 Generated files:"
          ls -lah

          APPIMAGE_FILE=$(find . -maxdepth 1 -name "*.AppImage" | head -n 1)

          if [ -z "$APPIMAGE_FILE" ]; then
            echo "❌ AppImage not generated"
            exit 1
          fi

          chmod +x "$APPIMAGE_FILE"

          echo "✅ AppImage created:"
          echo "$APPIMAGE_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanne-DAW-AppImage
          path: "*.AppImage"
