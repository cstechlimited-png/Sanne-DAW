name: Build Ardour AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    env:
      APP_NAME: Sanne-DAW
      ICON_NAME: sanne-daw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            file \
            zsync \
            patchelf \
            python3 \
            python3-dev \
            pkg-config \
            desktop-file-utils \
            appstream \
            libfuse2 \
            libgtk2.0-dev \
            libglib2.0-dev \
            libglibmm-2.4-dev \
            libxml2-dev \
            libxml++2.6-dev \
            libsndfile1-dev \
            libboost-all-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libcurl4-gnutls-dev \
            libarchive-dev \
            libaubio-dev \
            libsuil-dev \
            vamp-plugin-sdk \
            librubberband-dev \
            liblrdf0-dev \
            lv2-dev \
            libserd-dev \
            libsord-dev \
            libsratom-dev \
            liblilv-dev \
            libtag1-dev \
            libsamplerate0-dev \
            libfftw3-dev \
            libusb-1.0-0-dev \
            libhidapi-dev \
            liblo-dev \
            libcairomm-1.0-dev \
            libpangomm-1.4-dev \
            libatkmm-1.6-dev \
            libsigc++-2.0-dev \
            libfreetype6-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev

      - name: Download linuxdeploy
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Clone Ardour source
        shell: bash
        run: |
          set -euo pipefail

          git clone --recursive https://github.com/Ardour/ardour.git source

      - name: Configure Ardour
        shell: bash
        run: |
          set -euo pipefail

          cd source
          ./waf configure --strict --with-backends=alsa,jack,dummy

      - name: Build Ardour
        shell: bash
        run: |
          set -euo pipefail

          cd source
          ./waf -j"$(nproc)"

      - name: Install into AppDir
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AppDir
          mkdir -p AppDir

          cd source
          DESTDIR="$GITHUB_WORKSPACE/AppDir" ./waf install

      - name: Debug installed files
        shell: bash
        run: |
          set -euo pipefail

          echo "AppDir tree:"
          find AppDir | sort || true

          echo "AppDir/usr/bin contents:"
          find AppDir/usr/bin -maxdepth 1 -type f -o -type l | sort || true

      - name: Locate installed Ardour binary
        shell: bash
        run: |
          set -euo pipefail

          BIN_PATH="$(find AppDir/usr/bin -maxdepth 1 -type f -perm -111 \
            \( -name 'ardour' -o -name 'ardour[0-9]*' \) \
            | sort -V | head -n 1 || true)"

          if [ -z "$BIN_PATH" ]; then
            BIN_PATH="$(find AppDir/usr/bin -maxdepth 1 -type f -perm -111 | sort | head -n 1 || true)"
          fi

          if [ -z "$BIN_PATH" ]; then
            echo "❌ Could not locate installed Ardour executable in AppDir/usr/bin"
            exit 1
          fi

          BIN_NAME="$(basename "$BIN_PATH")"

          echo "Found binary: $BIN_PATH"
          echo "BIN_PATH=$BIN_PATH" >> "$GITHUB_ENV"
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"

      - name: Add application icon
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "image.png" ]; then
            echo "❌ image.png not found in repository root"
            exit 1
          fi

          cp image.png "AppDir/${ICON_NAME}.png"
          mkdir -p "AppDir/usr/share/icons/hicolor/256x256/apps"
          cp image.png "AppDir/usr/share/icons/hicolor/256x256/apps/${ICON_NAME}.png"

      - name: Create desktop entry
        shell: bash
        run: |
          set -euo pipefail

          cat > "AppDir/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Sanne DAW
          Exec=${BIN_NAME}
          Icon=${ICON_NAME}
          Categories=AudioVideo;Audio;
          Terminal=false
          StartupWMClass=Ardour
          EOF

          desktop-file-validate "AppDir/${APP_NAME}.desktop"

      - name: Create AppRun
        shell: bash
        run: |
          set -euo pipefail

          cat > AppDir/AppRun <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          HERE="\$(dirname "\$(readlink -f "\$0")")"

          export LD_LIBRARY_PATH="\$HERE/usr/lib:\$HERE/usr/lib64:\$HERE/usr/lib/x86_64-linux-gnu:\${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="\$HERE/usr/share:\${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"

          exec "\$HERE/usr/bin/${BIN_NAME}" "\$@"
          EOF

          chmod +x AppDir/AppRun

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=x86_64

          ./linuxdeploy.AppImage \
            --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file "AppDir/${APP_NAME}.desktop" \
            --icon-file "AppDir/${ICON_NAME}.png" \
            --output appimage

      - name: Validate generated AppImage
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files:"
          ls -lah

          APPIMAGE="$(find . -maxdepth 1 -name "*.AppImage" | head -n 1 || true)"

          if [ -z "$APPIMAGE" ]; then
            echo "❌ AppImage not generated"
            exit 1
          fi

          mv "$APPIMAGE" "${APP_NAME}.AppImage"
          ls -lah "${APP_NAME}.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Sanne-DAW-AppImage
          path: Sanne-DAW.AppImage
          if-no-files-found: error
