name: Build Ardour AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    env:
      APP_NAME: Sanne-DAW
      BINARY_NAME: ardour6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Ardour source
        shell: bash
        run: |
          set -euo pipefail

          git clone --recursive https://github.com/Ardour/ardour.git source

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            python3 \
            python3-dev \
            pkg-config \
            libgtk2.0-dev \
            libglib2.0-dev \
            libxml2-dev \
            libsndfile1-dev \
            libboost-all-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libcurl4-gnutls-dev \
            libarchive-dev \
            libaubio-dev \
            libsuil-dev \
            vamp-plugin-sdk \
            liblrdf0-dev \
            lv2-dev \
            libserd-dev \
            libsord-dev \
            libsratom-dev \
            liblilv-dev \
            libtag1-dev \
            libsamplerate0-dev \
            libfftw3-dev \
            libusb-1.0-0-dev \
            libhidapi-dev \
            liblo-dev \
            libcairomm-1.0-dev \
            libpangomm-1.4-dev \
            libatkmm-1.6-dev \
            libgtkmm-2.4-dev \
            libxml++2.6-dev \
            libglibmm-2.4-dev \
            libsigc++-2.0-dev \
            libfreetype6-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libfuse2 \
            patchelf \
            zsync \
            file

      - name: Download linuxdeploy
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy

          chmod +x linuxdeploy

      - name: Configure Ardour
        shell: bash
        run: |
          set -euo pipefail

          cd source

          ./waf configure

      - name: Build Ardour
        shell: bash
        run: |
          set -euo pipefail

          cd source

          ./waf -j"$(nproc)"

      - name: Debug build output
        shell: bash
        run: |
          set -euo pipefail

          echo "📂 Build tree:"
          find source/build | sort || true

      - name: Locate Ardour binary
        shell: bash
        run: |
          set -euo pipefail

          BIN_PATH=$(find source/build \
            -type f \
            \( -name "ardour6" -o -name "ardour7" -o -name "ardour8" \) \
            | head -n 1 || true)

          if [ -z "$BIN_PATH" ]; then
            echo "❌ Could not locate Ardour executable"
            exit 1
          fi

          echo "✅ Found binary:"
          echo "$BIN_PATH"

          echo "BIN_PATH=$BIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AppDir

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share

          cp "$BIN_PATH" "AppDir/usr/bin/${BINARY_NAME}"

          chmod +x "AppDir/usr/bin/${BINARY_NAME}"

          if [ -d "source/gtk2_ardour" ]; then
            cp -r source/gtk2_ardour AppDir/usr/share/
          fi

          if [ -d "source/share" ]; then
            cp -r source/share AppDir/usr/
          fi

      - name: Add application icon
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "image.png" ]; then
            echo "❌ image.png not found"
            exit 1
          fi

          cp image.png AppDir/sanne-daw.png

      - name: Create desktop entry
        shell: bash
        run: |
          set -euo pipefail

          cat > AppDir/${APP_NAME}.desktop <<'EOF'
          [Desktop Entry]
          Name=Sanne DAW
          Exec=ardour6
          Icon=sanne-daw
          Type=Application
          Categories=AudioVideo;Audio;
          Terminal=false
          StartupWMClass=Ardour
          EOF

          sed -i 's/^          //' AppDir/${APP_NAME}.desktop

          desktop-file-validate AppDir/${APP_NAME}.desktop

      - name: Create AppRun
        shell: bash
        run: |
          set -euo pipefail

          cat > AppDir/AppRun <<'EOF'
          #!/usr/bin/env bash
          set -e

          HERE="$(dirname "$(readlink -f "$0")")"

          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib64:$HERE/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"

          exec "$HERE/usr/bin/ardour6" "$@"
          EOF

          sed -i 's/^          //' AppDir/AppRun

          chmod +x AppDir/AppRun

      - name: Debug AppDir
        shell: bash
        run: |
          set -euo pipefail

          echo "📂 AppDir structure:"
          find AppDir | sort

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=x86_64

          ./linuxdeploy \
            --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/${APP_NAME}.desktop \
            --icon-file AppDir/sanne-daw.png \
            --output appimage

      - name: Validate generated AppImage
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 Generated files:"
          ls -lah

          APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" | head -n 1)

          if [ -z "$APPIMAGE" ]; then
            echo "❌ AppImage not generated"
            exit 1
          fi

          echo "✅ AppImage generated:"
          echo "$APPIMAGE"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Sanne-DAW-AppImage
          path: "*.AppImage"
